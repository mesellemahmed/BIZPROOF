[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bizproof"
version = "0.6.2"
description = "Evidence-carrying business-semantic validation for software systems."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "BIZPROOF Research Team"}
]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "z3-solver==5.1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
  "mypy>=1.16,<2",
  "types-PyYAML>=6.0.12",
  "hypothesis==6.168.1",
  "crosshair-tool==0.0.110",
]

[project.scripts]
bizproof = "bizproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["bizproof"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["z3", "z3.*"]
ignore_missing_imports = true
