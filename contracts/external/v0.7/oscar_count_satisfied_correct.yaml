id: EXT-OSCAR-COUNT-SAT-001
title: Django-Oscar count-condition satisfaction threshold semantic slice

target:
  source: benchmarks/v0.7/adapters/oscar_count_satisfied.py
  function: count_condition_satisfied

inputs:
  num_matches:
    type: int
    min: 0
    max: 1000
    label: Number of matching basket items after aggregation
  required_count:
    type: int
    min: 1
    max: 1000
    label: Required count for the offer condition

precondition: "num_matches >= 0 and required_count >= 1"
postcondition: "result == (num_matches >= required_count)"

business:
  expected_outcome: "The count condition is satisfied when the aggregated match count reaches or exceeds the required count."
