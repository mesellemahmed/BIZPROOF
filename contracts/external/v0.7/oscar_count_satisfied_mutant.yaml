id: EXT-OSCAR-COUNT-SAT-001-MUT
title: Mutated Django-Oscar count-condition satisfaction threshold semantic slice

target:
  source: benchmarks/v0.7/adapters/oscar_count_satisfied.py
  function: mutant_count_condition_satisfied

inputs:
  num_matches:
    type: int
    min: 0
    max: 1000
  required_count:
    type: int
    min: 1
    max: 1000

precondition: "num_matches >= 0 and required_count >= 1"
postcondition: "result == (num_matches >= required_count)"

business:
  expected_outcome: "The injected threshold-boundary mutation must be disproved."
