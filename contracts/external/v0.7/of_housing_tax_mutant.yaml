id: EXT-OF-TH-001-MUT
title: Mutated OpenFisca housing tax after relief semantic slice

target:
  source: benchmarks/v0.7/adapters/openfisca_housing_tax.py
  function: mutant_housing_tax_after_relief

inputs:
  tax_before_relief:
    type: int
    min: 0
    max: 1000000
  relief:
    type: int
    min: 0
    max: 1000000

precondition: "tax_before_relief >= 0 and relief >= 0"
postcondition: "((tax_before_relief >= relief) and (result == tax_before_relief - relief)) or ((tax_before_relief < relief) and (result == 0))"

business:
  expected_outcome: "The injected missing-clamp mutation must be disproved."
